name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: node --test
        env:
          # On Windows also exercise DPAPI and the password window for real.
          MSSQL_DATA_TEST_DPAPI: ${{ runner.os == 'Windows' && '1' || '' }}
          MSSQL_DATA_TEST_DIALOG: ${{ runner.os == 'Windows' && '1' || '' }}
