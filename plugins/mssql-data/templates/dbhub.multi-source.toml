# --- Tools: read-only everywhere by default
[[tools]]
name = "execute_sql"
source = "sales"
readonly = true
max_rows = 1000

[[tools]]
name = "search_objects"
source = "sales"

[[tools]]
name = "explain_sql"
source = "sales"

[[tools]]
name = "health_check"
source = "sales"

[[tools]]
name = "execute_sql"
source = "hr"
readonly = true
max_rows = 500

[[tools]]
name = "search_objects"
source = "hr"

