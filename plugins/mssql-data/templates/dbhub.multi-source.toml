# DBHub template: several SQL Server 2022 databases / servers.
#
# Use this instead of the plugin's built-in single-database config when you
# need more than one database, an SSH tunnel, or (carefully) write access.
#
# 1. Copy this file somewhere outside any git repo, e.g. ~/.config/dbhub/mssql.toml
# 2. Keep secrets in environment variables (exported in your shell profile or a
#    .env file next to the TOML) - ${VAR} is interpolated at load time.
# 3. Register it:
#      claude mcp add dbhub-mssql -- npx -y @bytebase/dbhub@1.5.0 --transport stdio --config ~/.config/dbhub/mssql.toml
# 4. Disable the plugin's built-in "dbhub" server (/plugin -> mssql-data) to
#    avoid two overlapping instances.
#
# Reference: https://dbhub.ai/config/toml

# --- Source 1: sales database, SQL login (individual fields: no URL-encoding needed)
[[sources]]
id = "sales"
description = "SalesDB on SQLPROD01 (SQL Server 2022)"
type = "sqlserver"
host = "sqlprod01.corp.local"
port = 1433
database = "SalesDB"
user = "report_ro"
password = "${MSSQL_SALES_PASSWORD}"
sslmode = "require"              # internal self-signed cert; use "verify-full" with an internal CA
connection_timeout = 30
query_timeout = 60
lazy = true

# --- Source 2: HR database, Windows / Active Directory login (NTLM), named instance
[[sources]]
id = "hr"
description = "HRDB on SQLPROD02, instance HR (SQL Server 2022)"
type = "sqlserver"
host = "sqlprod02.corp.local"
port = 1433
database = "HRDB"
instanceName = "HR"
user = "svc_report"
password = "${MSSQL_HR_PASSWORD}"
authentication = "ntlm"
domain = "CORP"
sslmode = "require"
lazy = true

# --- Source 3 (optional): reached through an SSH bastion
# [[sources]]
# id = "branch"
# description = "Branch server behind bastion"
